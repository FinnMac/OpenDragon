[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opendragon"
version = "0.0.1"
description = "An open-source, offline hybrid (DNN-HMM) speech recogniser with continuous voice adaptation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "vosk",
    "sounddevice",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["opendragon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
